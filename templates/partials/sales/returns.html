{% load i18n %}
<div class="bg-card p-6 rounded shadow">
    <h2 class="text-xl font-bold mb-4">{% trans "Return Items for Sale" %} {{ sale.sale_id }}</h2>
    <form method="post" hx-post="{% url 'return_sale' sale.id %}" hx-target="#main-content" hx-swap="innerHTML">
        {% csrf_token %}
        <div class="mb-4">
            <p class="font-semibold">{% trans "Select items to return:" %}</p>
            <div class="grid grid-cols-1 gap-2 mt-2">
                {% for item in sale.items.all %}
                <label class="flex items-center gap-2">
                    <input type="checkbox" name="items" value="{{ item.id }}">
                    {{ item.item.name_en }} × {{ item.quantity }} – {{ item.total_price }} ₪
                </label>
                {% empty %}
                <p>{% trans "No items in this sale." %}</p>
                {% endfor %}
            </div>
        </div>
        <div class="mb-4">
            <label for="reason" class="block text-sm font-medium">{% trans "Reason for return" %}</label>
            <textarea name="reason" id="reason" rows="3" class="w-full border rounded p-2"></textarea>
        </div>
        <div class="flex gap-2">
            <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded">{% trans "Process Return" %}</button>
            <a href="{% url 'sales_list' %}" class="bg-gray-300 text-gray-700 px-4 py-2 rounded">{% trans "Cancel" %}</a>
        </div>
    </form>
</div>
