
{% load i18n %}
<div class="max-w-md mx-auto bg-card rounded-xl shadow-md p-6">
    <h2 class="text-xl font-bold mb-4">{% trans "Adjust Stock" %} – {{ item.name_en }}</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-primary">{% trans "Current Stock" %}</label>
            <input type="number" name="stock_quantity" value="{{ item.stock_quantity }}" class="w-full border rounded p-2" required>
        </div>
        <div class="flex gap-2">
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">{% trans "Save" %}</button>
            <a href="{% url 'inventory_list' %}" class="bg-hover text-primary px-4 py-2 rounded">{% trans "Cancel" %}</a>
        </div>
    </form>
</div>
