{% load i18n %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">{{ title }}</h1>
<form method="post" class="bg-card p-6 rounded shadow"
  {% if form.instance.pk %}hx-post="{% url 'employee_edit' form.instance.pk %}"
  {% else %}hx-post="{% url 'employee_create' %}" {% endif %} hx-target="#main-content" hx-swap="innerHTML">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded mt-2">{% trans "Save" %}</button>
  <a href="{% url 'employee_list' %}"
    class="bg-hover text-primary px-4 py-2 rounded mt-2 inline-block">{% trans "Cancel" %}</a>
</form>
{% endblock %}
