{% load i18n %}
{% load static %}
<header
    class="bg-[var(--bg-sidebar)] text-[var(--text-primary)] shadow-[var(--modal-shadow)] p-4 flex justify-between items-center">
    <!-- Left: Logo -->
    <div class="flex justify-start items-center flex-1 gap-6">
        <div class="flex items-center">
            <img src="{% static 'img/logo.svg' %}" alt="Logo" class="h-8 mr-2">
        </div>
    </div>

    <!-- Right: Theme toggle, language, user menu -->
    <div class="flex justify-end items-center flex-1 gap-6">
        <!-- Theme toggle -->
        <button id="theme-toggle" class="theme-switch" aria-label="Toggle Theme">
            <i class="fas fa-moon moon-icon"></i>
            <span class="switch-thumb"></span>
            <i class="fas fa-sun sun-icon"></i>
        </button>



        <!-- User dropdown (Alpine.js) -->
        {% if user.is_authenticated %}
        <div class="flex items-center relative" x-data="{ open: false }">
            <button @click="open = !open" class="flex items-center gap-1 focus:outline-none">
                <i class="fa-solid fa-user text-[var(--primary)] text-xl"></i>
                <i class="fa-solid fa-caret-down text-[var(--primary)] text-sm"></i>
            </button>
            <div x-show="open" x-cloak
                class="absolute right-0 mt-2 w-48 bg-[var(--bg-card)] rounded-md shadow-lg py-1 z-50 top-full user-menu">
                <div class="px-4 py-2 text-sm font-semibold border-b border-gray-200 dark:border-gray-700">
                    {{ user.username }}
                </div>
                <a href="{% url 'settings_account' %}"
                    class="block px-4 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-700">{% trans "Profile" %}</a>
                <a href="{% url 'settings_container' %}"
                    class="block px-4 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-700">{% trans "Settings" %}</a>
                <form action="{% url 'logout' %}" method="post" class="block">
                    {% csrf_token %}
                    <button type="submit"
                        class="w-full text-start px-4 py-2 text-sm text-[var(--danger)] hover:bg-gray-100 dark:hover:bg-gray-700">
                        {% trans "Logout" %}
                    </button>
                </form>
                <!-- Language switcher -->
                <form action="{% url 'set_language' %}" method="post" class="inline">
                    {% csrf_token %}
                    <input name="next" type="hidden" value="{{ request.path }}">
                    <select name="language" onchange="this.form.submit()" class="border rounded p-1 text-sm">
                        {% get_current_language as CURRENT_LANG %}
                        <option value="en" {% if CURRENT_LANG == 'en' %}selected{% endif %}>English</option>
                        <option value="ar" {% if CURRENT_LANG == 'ar' %}selected{% endif %}>العربية</option>
                    </select>
                </form>
            </div>
        </div>
        {% else %}
        <a href="{% url 'login' %}" class="text-[var(--primary)]">{% trans "Login" %}</a>
        {% endif %}
    </div>

    <!-- Hamburger button (mobile) – uses Alpine.js sidebarOpen from parent -->
    {% if user.is_authenticated %}
    <button @click="sidebarOpen = !sidebarOpen" @click.away="sidebarOpen = false"
        class="block max-xl:block xl:hidden text-gray-600 focus:outline-none ml-2">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>
    {% endif %}
</header>

<!-- Theme toggle script (unchanged) -->
<script>
    const toggleBtn = document.getElementById("theme-toggle");
    toggleBtn?.addEventListener("click", () => {
        const html = document.documentElement;
        const current = html.dataset.theme === "dark" ? "light" : "dark";
        html.dataset.theme = current;
        localStorage.setItem("theme", current);
    });
    document.addEventListener("DOMContentLoaded", () => {
        const theme = localStorage.getItem("theme") || "light";
        document.documentElement.dataset.theme = theme;
    });
</script>

<style>
    [x-cloak] {
        display: none !important;
    }

    [dir="rtl"] .user-menu {
        left: 0;
        right: auto;
    }
</style>
