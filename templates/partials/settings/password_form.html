{% load i18n %}
<div class="bg-red-50 border border-red-200 p-4 rounded">
    {{ form.non_field_errors }}
    <ul class="list-disc pl-5 text-red-600">
    {% for field in form %}
        {% for error in field.errors %}
        <li>{{ error }}</li>
        {% endfor %}
    {% endfor %}
    </ul>
</div>
