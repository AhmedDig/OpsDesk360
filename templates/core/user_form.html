{% extends 'base.html' %}
{% load i18n %}
{% block content %}
    <h1 class="text-2xl font-bold mb-4">{{ title }}</h1>
    <form method="post" class="bg-white p-6 rounded shadow">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded mt-2">{% trans "Save" %}</button>
        <a href="{% url 'user_list' %}"
           class="bg-gray-300 text-gray-800 px-4 py-2 rounded mt-2 inline-block">{% trans "Cancel" %}</a>
    </form>
{% endblock %}
