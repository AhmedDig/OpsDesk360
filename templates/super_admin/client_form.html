{% extends 'base.html' %}
{% load i18n %}
{% block content %}
    <h2 class="text-2xl font-bold mb-6">{{ title }}</h2>
    <form method="post" class="bg-white p-6 rounded shadow max-w-2xl">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="mt-6 space-x-2">
            <button type="submit"
                    class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">{% trans "Save" %}</button>
            <a href="{% url 'super_admin:client_list' %}"
               class="bg-gray-300 text-gray-800 px-4 py-2 rounded hover:bg-gray-400">{% trans "Cancel" %}</a>
        </div>
    </form>
{% endblock %}
